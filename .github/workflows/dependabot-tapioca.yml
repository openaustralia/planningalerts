# Regenerates Sorbet's Tapioca-managed RBI files on Dependabot bundler PRs, since
# Dependabot only bumps Gemfile.lock and never runs tapioca itself. Without this,
# ci:type reliably fails on gem-bump PRs with a stale-RBI error unrelated to any
# real incompatibility (see openaustralia/planningalerts#2082 and PR #2139).
#
# The actual job lives in openaustralia/pavlovabot, shared across openaustralia
# repos - see that repo's README for the full design and how the App/secrets are
# set up. This file is just the caller.
name: Dependabot Tapioca

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  update_tapioca:
    if: >
      github.actor == 'dependabot[bot]' &&
      startsWith(github.head_ref, 'dependabot/bundler/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: openaustralia/pavlovabot/.github/workflows/dependabot-tapioca.yml@main
    secrets:
      app-id: ${{ secrets.PAVLOVABOT_APP_ID }}
      private-key: ${{ secrets.PAVLOVABOT_PRIVATE_KEY }}
